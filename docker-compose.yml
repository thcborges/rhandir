services:
  postgres:
    image: postgres:16-alpine
    container_name: rhandir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rhandir}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/br:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-rhandir}"]
      interval: 5s
      timeout: 5s
      retries: 5
